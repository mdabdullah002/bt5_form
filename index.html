<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bt5_form</title>
    <!-- css links  -->
     <link rel="stylesheet" href="css/bootstrap.css">
     <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container">
        <!-- form  -->
        <form class="row g-3 needs-validation" novalidate>
             <!-- first name start  -->
            <div class="col-md-6">
              <label for="f_name" class="form-label">First name</label>
              <input type="text" class="form-control f_name" id="f_name" name="f_name" placeholder="enter your first name" required>
              <div class="valid-feedback">
                Looks good!
              </div>
              <div class="invalid-feedback">
                enter your first name
              </div>
            </div>
            <!-- last name start  -->
            <div class="col-md-6">
              <label for="l_name" class="form-label">Last name</label>
              <input type="text" class="form-control l_name" id="l_name" name="l_name" placeholder="enter your last name" required>
              <div class="valid-feedback">
                Looks good!
              </div>
              <div class="invalid-feedback">
                enter your last name
              </div>
            </div>

             <!-- email  -->
             <div class="col-md-6">
                <label for="email" class="form-label"> Email Address</label>
                <input type="email" class="form-control email" id="email" name="email" placeholder="enter your Email Address" required>
                <div class="valid-feedback">
                  Looks good!
                </div>
                <div class="invalid-feedback">
                    enter your Email Address
                </div>
              </div>

              <!-- password  -->
             <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control password" id="password" name="password" placeholder="enter your password" required>
                <div class="valid-feedback">
                  Looks good!
                </div>
                <div class="invalid-feedback">
                    enter your password
                </div>
              </div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">
                  Agree to terms and conditions
                </label>
                <div class="invalid-feedback">
                  You must agree before submitting.
                </div>
              </div>
            </div>

            <div class="col-12">
              <button class="btn btn-primary" type="submit">Submit form</button>
            </div>

          </form>
        <!-- form  -->
    </section>
    <!-- js links  -->
     <script src="js/bootstrap.bundle.min.js"></script>
     <script src="js/script.js"></script>
</body>
</html>
